name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Write version file
        run: |
          echo "${{ github.event.inputs.version }}" | sed 's/^v//' > version.txt
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb==0.5.3 numpy==1.26.4 scipy==1.13.1
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary
        run: python install/build.py binary

      - name: Build Debian Package
        run: python install/build.py deb

      - name: Build RPM Spec & PKGBUILD
        run: |
          python install/build.py rpm
          python install/build.py arch

      - name: Rename binary for release
        run: |
          mv dist/ocbrain dist/ocbrain-linux-amd64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/ocbrain-linux-amd64
            dist/*.deb
            dist/*.spec
            dist/PKGBUILD

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Write version file
        run: |
          echo "${{ github.event.inputs.version }}" | sed 's/^v//' > version.txt
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb==0.5.3 numpy==1.26.4 scipy==1.13.1
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install NSIS
        run: choco install nsis -y
        shell: cmd

      - name: Add NSIS to PATH
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
          echo "C:\Program Files\NSIS" >> $GITHUB_PATH
        shell: bash

      - name: Build Binary
        run: python install/build.py binary

      - name: Build Windows Installer
        run: |
          python install/build.py windows
          makensis dist\ocbrain_installer.nsi
        shell: cmd

      - name: Rename binary for release
        run: |
          mv dist/ocbrain.exe dist/ocbrain-windows-amd64.exe
        shell: bash

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/ocbrain-windows-amd64.exe
            dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Write version file
        run: |
          echo "${{ github.event.inputs.version }}" | sed 's/^v//' > version.txt
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb==0.5.3 numpy==1.26.4 scipy==1.13.1
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary
        run: python install/build.py binary

      - name: Build macOS PKG
        run: |
          python install/build.py macos
          python install/build.py homebrew

      - name: Rename binary for release
        run: |
          mv dist/ocbrain dist/ocbrain-macos-amd64

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/ocbrain-macos-amd64
            dist/*.pkg
            dist/*.rb

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write version file
        run: |
          echo "${{ github.event.inputs.version }}" | sed 's/^v//' > version.txt
        shell: bash

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential libffi-dev libssl-dev zip unzip

      - name: Install python-for-android
        run: |
          pip install --upgrade pip
          pip install python-for-android virtualenv

      - name: Build Android package
        run: |
          # Package the repository as an Android-installable Termux bundle
          mkdir -p dist/android
          tar -czf dist/android/ocbrain-android-termux.tar.gz main.py core modules config requirements.txt version.txt pyproject.toml setup.sh install.sh

          # We also construct a basic python-for-android configuration and attempt APK build.
          # Building full APK with heavy native modules like sentence-transformers, scipy, and chromadb on mobile NDK requires extremely complex cross-compilation.
          # The Termux bundle is the most standard way to run the daemon CLI directly on Android.
          # However, we attempt a p4a run as well and ignore failures to ensure CI continuity.
          p4a apk --private . \
            --package=io.ocbrain \
            --name="OCBrain" \
            --version=$(cat version.txt) \
            --bootstrap=sdl2 \
            --requirements=python3,fastapi,uvicorn,httpx,aiohttp,aiofiles,pydantic,tomli,tomli-w,PyYAML,watchdog,spacy,chromadb,sentence-transformers,scipy,beautifulsoup4,trafilatura,feedparser,datasketch,pystray,Pillow,sqlalchemy,click,rich,requests,python-dotenv \
            --arch=arm64-v8a \
            --release || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            dist/android/ocbrain-android-termux.tar.gz
            *.apk

  release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            release-dist/ocbrain-linux-amd64
            release-dist/*.deb
            release-dist/*.spec
            release-dist/PKGBUILD
            release-dist/ocbrain-windows-amd64.exe
            release-dist/*.exe
            release-dist/ocbrain-macos-amd64
            release-dist/*.pkg
            release-dist/*.rb
            release-dist/ocbrain-android-termux.tar.gz
            release-dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
