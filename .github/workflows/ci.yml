name: CI

on:
  push:
    branches: [ main, 'h2/**', 'integration/**' ]
  pull_request:
    # `main`, plus the integration base that the sandbox-network-isolation PRs
    # (B02, B03, ...) actually target.  Exact name on purpose: a wildcard would
    # also trigger for PRs into every other workstream branch.
    branches: [ main, 'sandbox-network-isolation/b01-base' ]

permissions:
  contents: read

jobs:
  drift-and-ownership:
    # Fast, fully deterministic gates first: no network, no flaky external
    # dependency, no ambiguity about what "pass" means. Runs before the
    # (slower, environment-sensitive) test job so an architecture violation
    # or an out-of-scope file change is reported immediately rather than
    # buried after several minutes of dependency installation and test
    # collection.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # check_packet_ownership.py diffs against main's merge-base

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Architecture drift check (DRIFT-01..15)
        run: |
          python3 scripts/check_drift.py --out /tmp/drift-report.json
          echo "Full report: /tmp/drift-report.json (also uploaded as an artifact below)"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-report
          path: /tmp/drift-report.json

      - name: Packet ownership check (only on a recognized packet branch)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          PACKET=$(python3 -c "
          import json
          m = json.load(open('docs/architecture/h2_packet_ownership.json'))
          branch = '$BRANCH'
          match = [pid for pid, e in m['packets'].items() if e['branch'] == branch]
          print(match[0] if match else '')
          ")
          if [ -z "$PACKET" ]; then
            echo "Branch '$BRANCH' is not one of this manifest's declared packet branches -- "
            echo "ownership check is scoped to packet branches (docs/architecture/h2_packet_ownership.json), "
            echo "skipping cleanly rather than failing on an inapplicable check."
          else
            echo "Branch '$BRANCH' -> packet $PACKET"
            python3 scripts/check_packet_ownership.py --packet "$PACKET"
          fi

  tests:
    runs-on: ubuntu-latest
    env:
      # The image the Docker-backed sandbox tests run their commands in
      # (read by DockerBackend and by tests/core/sandbox/*; the code's own default is
      # `alpine:3`).  It must contain python3: about 15 tests launch `python3`
      # inside the container (see the "image must contain python3" note in
      # tests/core/sandbox/test_network_isolation_contract.py), and a bare
      # alpine:3 does not.  `python:3.12-alpine` is alpine with python3.  It is set
      # here, once, for the preflight step and for pytest, so the two cannot
      # diverge.  The digest actually used is recorded by the preflight step.
      OCBRAIN_SANDBOX_DOCKER_IMAGE: python:3.12-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Docker preflight and test-image provisioning
        # Fail-closed prerequisite for the Docker-backed tests (scripts/ci_docker_preflight.py,
        # unit-tested in tests/test_ci_docker_preflight.py): a reachable daemon, exactly
        # this image reference provisioned in THIS job's daemon, resolved to a RepoDigest
        # the way DockerBackend resolves it, and a container actually started from it
        # with every executable the tests launch present.  Before this step the image
        # was never provisioned and 75 tests failed with "no such object: alpine:3".
        # No fallback image; no mocks; nothing is added to the known-failure list.
        #
        # The step is exactly ONE command (a test pins that): nothing may be appended to it
        # that could turn its exit code into success.  `--probe-capabilities` additionally
        # exercises the busybox features the tests depend on (nanosecond `date`, fractional
        # `sleep`, `head -c`), which a presence check cannot see.
        run: |
          python3 scripts/ci_docker_preflight.py \
            --image "$OCBRAIN_SANDBOX_DOCKER_IMAGE" \
            --report /tmp/docker-preflight.json \
            --probe-capabilities \
            --require-executable python3 \
            --require-executable sh \
            --require-executable sleep \
            --require-executable true \
            --require-executable echo \
            --require-executable printenv \
            --require-executable yes \
            --require-executable head \
            --require-executable grep \
            --require-executable date \
            --require-executable mv \
            --require-executable rm \
            --require-executable cat \
            --require-executable ln \
            --require-executable mkdir \
            --require-executable mkfifo \
            --require-executable hostname \
            --require-executable readlink \
            --require-executable ls

      - name: Upload Docker preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-preflight
          path: /tmp/docker-preflight.json
          if-no-files-found: error

      - name: Run test suite
        # This step records pytest's REAL exit code and never fails by itself;
        # the gate step below decides. It must not discard the exit code (the
        # previous `... | tee ... || true` did, which let collection errors,
        # setup errors, INTERNALERROR and zero-collected runs pass -- FZ-07).
        # `tee` would hide it as the pipeline's status, so read PIPESTATUS.
        #
        # The repository still has a documented set of known-failing tests
        # (docs/architecture/D10_KNOWN_ENVIRONMENTAL_FAILURES.txt); the gate
        # tolerates ONLY those, only with pytest exit code 1.
        #
        # `-rfEs` keeps pytest's DEFAULT short-summary set (`f` failed, `E` error: the
        # gate reads the FAILED/ERROR node ids from it) and adds `s`, the skip reasons,
        # so that every skip in a hosted run can be attributed (a skipped test is not a
        # pass).  Do not shorten it to `-rs`: `-r` REPLACES the default, the FAILED lines
        # disappear, and the gate then fails with "0 distinct FAILED node ID(s)".
        run: |
          set +e
          pytest tests/ -q --tb=short -rfEs 2>&1 | tee /tmp/pytest-output.txt
          echo "${PIPESTATUS[0]}" > /tmp/pytest-exit-code.txt
          exit 0

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-output
          path: |
            /tmp/pytest-output.txt
            /tmp/pytest-exit-code.txt

      - name: Gate on pytest exit code, errors and unlisted failures
        # Fails on: any pytest exit code other than 0/1, a missing summary
        # line, ERROR/INTERNALERROR entries, zero passed tests, and any FAILED
        # test that is not already in the known-failure list. Logic and its
        # contract: scripts/ci_test_gate.py (unit-tested in
        # tests/test_ci_test_gate.py). Do not widen it silently.
        run: |
          python3 scripts/ci_test_gate.py \
            --output /tmp/pytest-output.txt \
            --exit-code-file /tmp/pytest-exit-code.txt \
            --allowlist docs/architecture/D10_KNOWN_ENVIRONMENTAL_FAILURES.txt

      - name: Assert the Docker-backed tests ran (none skipped for a missing daemon or image)
        # The preflight step has just proved a reachable daemon and the provisioned image.  A
        # SKIPPED line whose reason says either is missing therefore means a Docker-gating probe
        # inside the tests (a 5 s / 10 s timeout at import time) misfired, and the whole
        # Docker-backed suite would pass without having run.  A skip is not a pass.  Other skips
        # (for example the 32-bit toolchain one) are listed by `-rs` and judged on their own reason.
        run: |
          if grep -E '^SKIPPED .*(requires a reachable Docker daemon|requires the test image)' /tmp/pytest-output.txt; then
            echo "::error::Docker-backed tests were skipped although the preflight proved the daemon and the image"
            exit 1
          fi
          echo "no Docker-prerequisite skips"

  typecheck-b03:
    # B03's acceptance includes a clean mypy run over its two files (reconciliation
    # section 22).  Until this job existed that evidence was local only, never CI.
    # Deliberately narrow: the two B03 files, not a repository-wide typing gate.
    # Command and flags are the ones recorded as the evidence of record:
    # MYPYPATH=. mypy [--strict] --explicit-package-bases --follow-imports=silent <files>.
    # The toolchain is pinned to the versions that evidence used (mypy 2.4.0, pytest 9.2.0),
    # so a future release of either cannot turn this job red (or green) on its own.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned mypy and pytest
        run: |
          python -m pip install --upgrade pip
          pip install mypy==2.4.0 pytest==9.2.0

      - name: mypy on the B03 files (default and --strict)
        # Both runs always execute and both exit codes are kept; the step fails
        # unless BOTH are 0.  The full output is uploaded as an artifact.
        run: |
          set +e
          export MYPYPATH=.
          FILES="core/sandbox/backends/_sandbox_network.py tests/core/sandbox/test_sandbox_network_guards.py"
          {
            python --version
            mypy --version
            python -m pip list 2>/dev/null | grep -i -E '^(pytest|mypy) '
            echo "files: $FILES"
          } 2>&1 | tee /tmp/mypy-b03.txt
          echo "== mypy (default) ==" | tee -a /tmp/mypy-b03.txt
          mypy --explicit-package-bases --follow-imports=silent $FILES 2>&1 | tee -a /tmp/mypy-b03.txt
          RC_DEFAULT=${PIPESTATUS[0]}
          echo "== mypy --strict ==" | tee -a /tmp/mypy-b03.txt
          mypy --strict --explicit-package-bases --follow-imports=silent $FILES 2>&1 | tee -a /tmp/mypy-b03.txt
          RC_STRICT=${PIPESTATUS[0]}
          echo "exit codes: default=$RC_DEFAULT strict=$RC_STRICT" | tee -a /tmp/mypy-b03.txt
          [ "$RC_DEFAULT" = "0" ] && [ "$RC_STRICT" = "0" ]

      - name: Upload mypy output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mypy-b03
          path: /tmp/mypy-b03.txt
          if-no-files-found: error
