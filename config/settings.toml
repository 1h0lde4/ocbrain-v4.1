[global]
language = "auto"
response_style = "concise"
confidence_floor = 0.6
fanout_on_ambiguity = true
context_window = 10
ollama_host = "http://localhost:11434"
classifier_model = "mistral"
web_ui_port = 7437
voice_enabled = false
log_level = "INFO"
# /import boundary (CTX-EXPORT-001, issue #54): the ONLY directory /import and
# /brain/v2/import may read a bundle from. Absolute, or relative to the project
# root. Unset = imports are refused. Bundle files must end in ".ocbrain".
# import_root = "data/exports"

[runtime]
use_k42_frontend = true
max_recovery_attempts = 3

# ADR-KERNEL-07 (PROPOSED; D-5 resolved as Option C): creative content-anchor
# detector -- a NARROW experimental slice toward intent sufficiency, not intent
# sufficiency itself. When true (and use_k42_frontend is true), a pure detector
# observes open-ended creative requests; a form-only request (e.g. "write a 1000
# words story") is escalated by the EXISTING OrchestrationGovernor at Plan
# Compilation and answered with a clarifying question instead of being executed.
# No new gate. Default false: no behavior change.
creative_content_anchor_enabled = false

# Execution-budget defaults (K4.4). Distinct from max_recovery_attempts
# above, which governs ADR-K4.2-H-05's OperationRecoveryBudget (autonomous
# recovery attempts across a whole operation) -- these govern the time
# envelope of a single execution attempt. See core/runtime/execution_budget.py.
default_short_request_ceiling_s = 60.0
default_startup_budget_s = 10.0
default_progress_budget_s = 45.0
default_hard_ceiling_s = 300.0
max_budget_extension_s = 240.0

[privacy]
save_history = true
save_training_pairs = true
telemetry = false
encrypt_context_db = false

[learning]
crawl_interval_h = 1
clean_interval_h = 6
train_interval_h = 24
min_pairs_to_train = 500
replay_ratio = 0.2
training_enabled = true

[modules.coding]
enabled = true
keywords = [
    "write",
    "code",
    "script",
    "function",
    "debug",
    "fix",
    "build",
    "implement",
    "program",
    "snippet",
]
staleness_decay = true
max_kb_size_mb = 500
confidence_boost = 0.1
pin_to_external = false

[modules.web_search]
enabled = true
keywords = [
    "search",
    "find",
    "latest",
    "today",
    "current",
    "news",
    "lookup",
    "what is happening",
    "recent",
]
staleness_decay = true
max_kb_size_mb = 300
confidence_boost = 0.1
pin_to_external = false

[modules.knowledge]
enabled = true
keywords = [
    "explain",
    "what is",
    "how does",
    "why",
    "define",
    "summarize",
    "describe",
    "tell me about",
]
staleness_decay = false
max_kb_size_mb = 1000
confidence_boost = 0.05
pin_to_external = false

[modules.system_ctrl]
enabled = true
keywords = [
    "open",
    "close",
    "run",
    "launch",
    "start",
    "stop",
    "save",
    "delete",
    "move",
    "copy",
    "rename",
    "create file",
]
staleness_decay = false
max_kb_size_mb = 100
confidence_boost = 0.15
pin_to_external = false

[modules.test_config_reg_tmp]
enabled = true
keywords = [
    "test",
    "check",
]
staleness_decay = true
max_kb_size_mb = 500
confidence_boost = 0.1
pin_to_external = false

# ── Memory service (Rev 3, G4-FTS remediation) ───────────────────────────────
# This block documents/plumbs the Amendment 1 runtime gate. The gate verdicts
# themselves live in code (core/memory/sqlite_runtime.py); this file can only
# EXTEND the trusted set of builds or acknowledge an unsupported runtime — it
# can never turn a failing verdict into a passing one.
[memory]
# database = ".data/memory/unified.db"   # default; see core.config and the CLI
#                                         # memory-* commands' --db option.
# SQLite WAL runtime compatibility gate mode (Amendment 1):
#   "enforce"     — the default and fail-closed: an affected SQLite runtime
#                   (3.7.0 .. 3.51.3 without the fix, backport, or verified
#                   vendor provenance) refuses memory-ready state at
#                   construction.
#   "acknowledge" — a deliberate, documented operator exception:
#                   construction proceeds, but every readiness report
#                   honestly states the runtime is not fully supported
#                   (memory_ready=false). Acknowledgement NEVER changes the
#                   verdict — do not treat it as an approval.
# The environment variable OCBRAIN_MEMORY_RUNTIME_ACK overrides this value
# (same two values); tests use it — see conftest.py.
wal_gate_mode = "enforce"

# Verified vendor-build provenance records (Amendment 1 §D). A record here
# accepts ONE exact build, and only when EVERY field is filled: an incomplete
# record fails closed (rejected_unproven_build). source_id must be the exact
# sqlite_source_id() string of the shipped binary. Leave this table ABSENT
# unless the deployment has actually verified the build — a blank template is
# not evidence. Example shape (all four fields required):
#
# [[memory.wal_gate.approved_vendor_builds]]
# source_id    = "2025-07-30 19:33:53 4d8a..."   # exact sqlite_source_id()
# distribution = "ExampleOS sqlite 3.50.4-r1"    # who shipped this binary
# evidence_url = "https://example.com/notes"     # where the fix is documented
# verified_on  = "2026-01-15"                    # when WE verified it
